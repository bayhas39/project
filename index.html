/* ---------------- shared server sync (separate browsers / devices) -------------
   localStorage and BroadcastChannel never leave a browser profile, so a second
   Chrome account (or another device) could not see those edits. The dashboard's
   sync service is the shared copy. Wire format it speaks:
     POST <api>              { collection, payload }   -> { rev }
     GET  <api>?collection=c                            -> { payload, rev }
   The service bumps `rev` on every write. "__dhre_sync_rev" remembers the rev
   this browser already applied, so a pull is ignored unless the server really is
   newer -- that is what makes every account converge on the same data.
   Empty by default: set localStorage "dhre_sync_url" to a working service to
   turn shared sync on. With no URL the dashboard never leaves this browser.     */
const SYNC_API = "/api/sync";
const REV_KEY = "__dhre_sync_rev";
const REMOTE = {
  url(){ return LS.get("dhre_sync_url", null) || SYNC_API; },
  revs(){ return LS.get(REV_KEY, {}) || {}; },
  setRev(col, rev){ const r = this.revs(); r[col] = rev; LS.set(REV_KEY, r); },
  /* ok:true = the service answered. payload is non-null only when it is newer. */
  async pull(col){
    const ac = new AbortController(); const timer = setTimeout(()=>ac.abort(), 15000);
    try{
      const res = await fetch(this.url() + "?collection=" + encodeURIComponent(col), { signal: ac.signal });
      const j = await res.json().catch(()=>null);   // 500 + {"error":"kv 404"} == empty store
      if(!j || !Array.isArray(j.payload)) return { ok:true, payload:null };
      const rev = typeof j.rev === "number" ? j.rev : null;
      if(rev != null && rev <= (this.revs()[col] || 0)) return { ok:true, payload:null };
      return { ok:true, payload:j.payload, rev };
    }catch(e){ return { ok:false, payload:null }; }
    finally{ clearTimeout(timer); }
  },
  async push(col, payload){
    const ac = new AbortController(); const timer = setTimeout(()=>ac.abort(), 15000);
    try{
      const res = await fetch(this.url(), {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ collection: col, payload }), signal: ac.signal,
      });
      const j = await res.json().catch(()=>null);
      if(j && typeof j.rev === "number") this.setRev(col, j.rev);
      return true;
    }catch(e){ return false; }
    finally{ clearTimeout(timer); }
  },
};
/* Owner links are same-origin, so the owner dashboard shares storage + BroadcastChannel with admin. */
const initialAuth = (sites) => {
  const params = new URLSearchParams(location.search);
  const siteId = params.get("owner") || params.get("site");
  const pin = params.get("pin");
  if(siteId){
    const site = sites.find(s=>s.id===siteId);
    if(site && (!pin || pin === site.pincode || pin === "1234"))
      return { role:"owner", siteId:site.id, name:site.inspector || "Owner", siteName:site.name, deep:true };
  }
  return LS.get("dhre-combined-auth", null);
};

const problemsOf = (s, incidents) => {
  const p=[];
  if((s.offlineCameras||0)>0) p.push("Offline CCTV");
  if((s.offlineANPR||0)>0) p.push("Offline ANPR");
  if((s.notWorkingANPR||0)>0) p.push("Not Working ACS");
  if((s.notWorkingGate||0)>0) p.push("Not Working Gate barrier");
  if((s.notWorkingIntercom||0)>0) p.push("Not Working Intercom");
  if((incidents||[]).some(i=>i.siteId===s.id && (i.status==="Open"||i.status==="In Review")) || s.status==="Issue Found") p.push("Incident Sites");
  return p;
};
const uptimeOf = (s) => s.totalCameras ? Math.round(((s.totalCameras-(s.offlineCameras||0))/s.totalCameras)*100) : 100;
const healthOf = (s) => {
  const total=(s.totalCameras||0)+(s.totalANPR||0);
  const bad=(s.offlineCameras||0)+(s.offlineANPR||0)+(s.notWorkingANPR||0)+(s.notWorkingGate||0)+(s.notWorkingIntercom||0);
  return total ? Math.max(0, Math.round(((total-bad)/total)*100)) : 100;
};

/* ---------------- toast ---------------- */
let pushToast = ()=>{};
const Toaster = () => {
  const [toasts, setToasts] = useState([]);
  useEffect(()=>{ pushToast = (msg, kind="success") => {
    const id = uid(); setToasts(t=>[...t, {id, msg, kind}]);
    setTimeout(()=> setToasts(t=>t.filter(x=>x.id!==id)), 3500);
  };},[]);
  const color = k => k==="error" ? "bg-red-600" : k==="info" ? "bg-sky-600" : "bg-slate-900";
  return (
    <div className="fixed bottom-4 right-4 z-[100] space-y-2 w-[320px]">
      {toasts.map(t=>(
        <div key={t.id} className={`${color(t.kind)} text-white text-sm font-semibold px-4 py-3 rounded-xl shadow-lg fade-up`}>{t.msg}</div>
      ))}
    </div>
  );
};
const toast = { success:(m)=>pushToast(m,"success"), error:(m)=>pushToast(m,"error"), info:(m)=>pushToast(m,"info") };
const copy = (text, msg) => { try{ navigator.clipboard.writeText(text); }catch(e){} toast.success(msg || "Copied"); };

const download = (filename, data) => {
  try{
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = filename; a.click();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  }catch(e){ toast.error("Export failed"); }
};
const ownerUrl = (s) => `${location.pathname || "index.html"}?owner=${encodeURIComponent(s.id)}&pin=${encodeURIComponent(s.pincode)}`;

/* ================================================================ */
/*                              APP                                 */
/* ================================================================ */
function App(){
  const [sites, setSites] = useState(()=> LS.get(COLLECTIONS.sites.key, null) || makeSites());
  const [incidents, setIncidents] = useState(()=> LS.get(COLLECTIONS.incidents.key, null) || makeIncidents());
  const [accidents, setAccidents] = useState(()=> LS.get(COLLECTIONS.accidents.key, []));
  const [auth, setAuth] = useState(()=> initialAuth(sites));

  // per-collection "this write came from the other dashboard" flags + payload dedupe
  const remote = useRef({});
  const seen = useRef({});
  // The first render must publish nothing: it would push whatever this browser
  // happened to load and stomp the shared copy the other accounts already have.
  const mounted = useRef(false);

  const [remoteOn, setRemoteOn] = useState(()=> LS.get("dhre_sync_on", true) !== false);
  const [syncInfo, setSyncInfo] = useState({ ok:false, at:"" });

  const applyRemote = (type, payload, msg) => {
    if(!COLLECTIONS[type] || !Array.isArray(payload)) return;
    const sig = type + "|" + JSON.stringify(payload);
    if(seen.current[type] === sig) return;
    seen.current[type] = sig;
    remote.current[type] = true;
    if(type==="sites") setSites(payload);
    if(type==="incidents") setIncidents(payload);
    if(type==="accidents") setAccidents(payload);
    toast.info(msg || "Updated from the other dashboard");
  };

  const markSync = (ok) => setSyncInfo({ ok:!!ok, at: fmtTime() });

  // Publish an edit: to the other open dashboards, and to the shared service.
  const publish = (type, payload) => {
    postSync(type, payload);
    if(REMOTE.url()) REMOTE.push(type, payload).then(markSync);
  };

  // Every edit from any screen persists, broadcasts and publishes from one place.
  useEffect(()=>{
    LS.set(COLLECTIONS.sites.key, sites); LS.set(COLLECTIONS.sites.mirror, sites);
    const sig = "sites|" + JSON.stringify(sites);
    if(remote.current.sites){ delete remote.current.sites; }
    else if(seen.current.sites !== sig){ seen.current.sites = sig; if(mounted.current) publish("sites", sites); }
  }, [sites]);

  useEffect(()=>{
    LS.set(COLLECTIONS.incidents.key, incidents);
    const sig = "incidents|" + JSON.stringify(incidents);
    if(remote.current.incidents){ delete remote.current.incidents; }
    else if(seen.current.incidents !== sig){ seen.current.incidents = sig; if(mounted.current) publish("incidents", incidents); }
  }, [incidents]);

  useEffect(()=>{
    LS.set(COLLECTIONS.accidents.key, accidents);
    const sig = "accidents|" + JSON.stringify(accidents);
    if(remote.current.accidents){ delete remote.current.accidents; }
    else if(seen.current.accidents !== sig){ seen.current.accidents = sig; if(mounted.current) publish("accidents", accidents); }
  }, [accidents]);

  useEffect(()=>{
    const onChannel = (e)=>{
      const d = e.data || {};
      if(COLLECTIONS[d.type]) applyRemote(d.type, d.payload);
    };
    // fallback for browsers without BroadcastChannel
    const onStorage = (e)=>{
      for(const type of Object.keys(COLLECTIONS)){
        const c = COLLECTIONS[type];
        if(e.key === c.key || (c.mirror && e.key === c.mirror)){
          applyRemote(type, LS.get(c.key, null));
          break;
        }
      }
    };
    const onMsg = (e)=>{
      const d = e.data || {};
      const type = String(d.type || "").replace(/^dhre-/, "");
      if(COLLECTIONS[type]) applyRemote(type, d.payload);
    };
    if(bc) bc.onmessage = onChannel;
    window.addEventListener("storage", onStorage);
    window.addEventListener("message", onMsg);
    return ()=>{
      if(bc) bc.onmessage = null;
      window.removeEventListener("storage", onStorage);
      window.removeEventListener("message", onMsg);
    };
  }, []);

  // Declared after the three publishers above so those see mounted === false.
  useEffect(()=>{ mounted.current = true; }, []);

  /* Shared service: seed an empty service from this browser, then poll for other
     accounts' edits and apply them in place -- no reload, same as a live tab. */
  useEffect(()=>{
    LS.set("dhre_sync_on", remoteOn);
    const api = REMOTE.url();
    if(!remoteOn || !api){ markSync(false); return; }
    let alive = true;
    const COLS = Object.keys(COLLECTIONS);

    const pull = async () => {
      let ok = false; const got = [];
      for(const col of COLS){
        if(!alive) return;
        const r = await REMOTE.pull(col);
        if(r.ok) ok = true;
        if(r.payload){ if(r.rev != null) REMOTE.setRev(col, r.rev); got.push([col, r.payload]); }
      }
      if(alive) markSync(ok);
      for(const [col, payload] of got) applyRemote(col, payload, "Updated from another device or account");
    };

    const boot = async () => {
      for(const col of COLS){
        if(!alive) return;
        const mine = LS.get(COLLECTIONS[col].key, null);
        if(mine == null) continue;
        const r = await REMOTE.pull(col);
        if(!r.payload) await REMOTE.push(col, mine);   // first contact: seed it
      }
      await pull();
    };

    boot();
    const iv = setInterval(pull, 3000);
    return ()=>{ alive = false; clearInterval(iv); };
  }, [remoteOn]);

  const logout = () => {
    if(!(auth && auth.deep)) localStorage.removeItem("dhre-combined-auth");
    setAuth(null);
  };

  const hasRemote = !!REMOTE.url();
  const syncMode = !remoteOn ? "paused" : !hasRemote ? "local" : (syncInfo.ok ? "live" : "offline");
  const shared = { remoteOn, setRemoteOn, syncMode, lastSync: syncInfo.ok ? syncInfo.at : "" };
  if(!auth) return <Login sites={sites} onAuth={setAuth}/>;
  if(auth.role==="owner") return <OwnerView auth={auth} sites={sites} setSites={setSites} incidents={incidents} setIncidents={setIncidents} accidents={accidents} setAccidents={setAccidents} onLogout={logout} {...shared}/>;
  return <AdminView auth={auth} sites={sites} setSites={setSites} incidents={incidents} setIncidents={setIncidents} accidents={accidents} onLogout={logout} {...shared}/>;
}

function AdminView({auth, sites, setSites, incidents, setIncidents, accidents, onLogout, setRemoteOn, syncMode, lastSync}){
  const [page, setPage] = useState(()=> LS.get("dhre_current_page", "sites"));
  const [clock, setClock] = useState(()=> fmtTime());
  const [editSite, setEditSite] = useState(null);
  useEffect(()=>{ LS.set("dhre_current_page", page); }, [page]);
  useEffect(()=>{ const t=setInterval(()=>setClock(fmtTime()), 5000); return ()=>clearInterval(t); }, []);
  const fileRef = useRef(null);

  const stats = useMemo(()=>({
    total: sites.length,
    pending: sites.filter(s=>s.status==="Pending").length,
    progress: sites.filter(s=>s.status==="In Progress").length,
    completed: sites.filter(s=>s.status==="Completed").length,
    issue: sites.filter(s=>s.status==="Issue Found").length,
    totalCameras: sites.reduce((a,s)=>a+(s.totalCameras||0),0),
    offlineCameras: sites.reduce((a,s)=>a+(s.offlineCameras||0),0),
    totalANPR: sites.reduce((a,s)=>a+(s.totalANPR||0),0),
    offlineANPR: sites.reduce((a,s)=>a+(s.offlineANPR||0),0),
    nwACS: sites.reduce((a,s)=>a+(s.notWorkingANPR||0),0),
    nwGate: sites.reduce((a,s)=>a+(s.notWorkingGate||0),0),
    nwIntercom: sites.reduce((a,s)=>a+(s.notWorkingIntercom||0),0),
  }), [sites]);

  const perSite = useMemo(()=> sites.map(s=>({
    id:s.id, name:s.name, shortName:s.name.replace(/^Site \d+ — /,""), location:s.location, status:s.status, type:s.type,
    totalCameras:s.totalCameras||0, offlineCameras:s.offlineCameras||0,
    totalANPR:s.totalANPR||0, offlineANPR:s.offlineANPR||0,
    notWorkingANPR:s.notWorkingANPR||0, notWorkingGate:s.notWorkingGate||0, notWorkingIntercom:s.notWorkingIntercom||0,
  })), [sites]);

  const attention = useMemo(()=>{
    const list=[];
    sites.forEach(site=>{
      const problems = problemsOf(site, incidents);
      if(problems.length===0) return;
      const siteIncidents = incidents.filter(i=>i.siteId===site.id && (i.status==="Open"||i.status==="In Review"));
      let severity = "Low";
      if(site.status==="Issue Found" || siteIncidents.some(i=>i.severity==="Critical")) severity="Critical";
      else if(siteIncidents.some(i=>i.severity==="High") || problems.length>=2) severity="High";
      else if(siteIncidents.some(i=>i.severity==="Medium")) severity="Medium";
      list.push({ site, problems, incidents:siteIncidents, reason:problems.join(" • "), severity });
    });
    const rank = { Critical:0, High:1, Medium:2, Low:3 };
    return list.sort((a,b)=> rank[a.severity]-rank[b.severity]);
  }, [sites, incidents]);

  const problemTotals = useMemo(()=>{
    const counts = {};
    sites.forEach(s=> problemsOf(s, incidents).forEach(p=> counts[p]=(counts[p]||0)+1));
    return counts;
  }, [sites, incidents]);

  const onExport = () => { download(`dhre-security-data-${new Date().toISOString().slice(0,10)}.json`, {sites, incidents, accidents, exportedAt:new Date().toISOString()}); toast.success("Exported data JSON"); };
  const onImportFile = (e) => {
    const file = e.target.files && e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const data = JSON.parse(reader.result);
        if(Array.isArray(data.sites)) setSites(data.sites);
        if(Array.isArray(data.incidents)) setIncidents(data.incidents);
        toast.success("Imported data — dashboard updated");
      }catch(err){ toast.error("Invalid JSON file"); }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  const HeaderRight = (
    <>
      <span className="hidden lg:inline text-xs text-sky-200 max-w-[160px] truncate">Admin • {auth.name}</span>
      <button onClick={onLogout} className="px-3 py-1.5 rounded-full bg-white/15 text-white border border-white/20 text-xs font-bold hover:bg-white/20 flex items-center gap-1.5">
        <IcLogout size={13}/> Logout
      </button>
      <button onClick={()=>{ setPage("sites"); setEditSite({}); }} className="hidden sm:inline-flex items-center gap-2 px-3 lg:px-5 py-2 rounded-full bg-white text-slate-900 text-xs font-bold hover:bg-slate-100 shadow">
        <IcPlus size={14}/> Add Site
      </button>
      <button onClick={onExport} className="hidden sm:inline-flex items-center gap-2 px-3 lg:px-5 py-2 rounded-full bg-white text-slate-900 text-xs font-bold hover:bg-slate-100 shadow">
        <IcDownload size={14}/> Export Data
      </button>
      <button onClick={()=>fileRef.current && fileRef.current.click()} className="hidden sm:inline-flex items-center gap-2 px-3 lg:px-5 py-2 rounded-full bg-white text-slate-900 text-xs font-bold hover:bg-slate-100 shadow">
        <IcUpload size={14}/> Import Data
      </button>
      <input ref={fileRef} type="file" accept="application/json" className="hidden" onChange={onImportFile}/>
    </>
  );

  const TABS = [
    { id:"sites",     icon:IcGrid,   label:"Sites" },
    { id:"charts",    icon:IcChart,  label:"Charts" },
    { id:"amc",       icon:IcVideo,  label:"AMC" },
    { id:"attention", icon:IcAlert,  label:"Attention", count:attention.length },
    { id:"reports",   icon:IcFileText, label:"Reports" },
    { id:"ai",        icon:IcSparkles, label:"AI Report" },
  ];

  return (
    <div className="min-h-screen bg-[#f8fafc] text-slate-900">
      <Header syncMode={syncMode} onToggleLive={()=>setRemoteOn(v=>!v)} lastSync={lastSync || clock} right={HeaderRight}>
        <div className="border-t bg-slate-50" style={{borderColor:"#eef2f7"}}>
          <div className="max-w-[1280px] mx-auto px-4 lg:px-6 h-[48px] flex items-center justify-center">
            <nav className="flex p-1 rounded-full bg-white border shadow-sm overflow-auto max-w-full" style={{borderColor:"#e2e8f0"}}>
              {TABS.map(t=>{
                const Icon = t.icon;
                return (
                  <button key={t.id} onClick={()=>setPage(t.id)} className={`px-3 lg:px-5 py-1.5 rounded-full text-sm font-bold flex items-center gap-1.5 transition shrink-0 ${page===t.id?"bg-slate-900 text-white shadow":"text-slate-600 hover:text-slate-900"}`}>
                    <Icon size={14}/> {t.label}
                    {t.count!==undefined && <span className="ml-1 px-1.5 py-0.5 rounded-full text-xs bg-red-100 text-red-700">{t.count}</span>}
                  </button>
                );
              })}
            </nav>
          </div>
        </div>
      </Header>

      <main className="max-w-[1280px] mx-auto px-4 lg:px-6 py-6 lg:py-8">
        <div key={page} className="page-fade">
          {page==="sites"     && <SitesPage sites={sites} setSites={setSites} incidents={incidents} setIncidents={setIncidents} accidents={accidents} stats={stats} setPage={setPage} onEditSite={setEditSite}/>}
          {page==="charts"    && <ChartsPage sites={sites} incidents={incidents} accidents={accidents} stats={stats} perSite={perSite} attention={attention} problemTotals={problemTotals} setPage={setPage}/>}
          {page==="amc"       && <AMCPage sites={sites} stats={stats} perSite={perSite} setPage={setPage}/>}
          {page==="attention" && <AttentionPage attention={attention} setPage={setPage}/>}
          {page==="reports"   && <ReportsPage sites={sites} incidents={incidents} setIncidents={setIncidents}/>}
          {page==="ai"        && <AIReportPage live={syncMode==="live"}/>}
        </div>
        <p className="mt-8 text-center text-xs text-slate-400">
          Page: {PAGE_LABEL[page]} •
          <button onClick={()=>setPage(PAGES[(PAGES.indexOf(page)+1)%PAGES.length])} className="underline font-semibold hover:text-slate-700 ml-1">
            Go to {NEXT_PAGE[page]} →
          </button>
        </p>
      </main>
      {editSite!==null && <SiteFormModal site={editSite} sites={sites} setSites={setSites} onClose={()=>setEditSite(null)}/>}
      <Toaster/>
    </div>
  );
}

  if((site.notWorkingANPR||0)>0) probs.push(`${site.notWorkingANPR} ACS down`);
  return (
    <div className="group bg-white rounded-[20px] border overflow-hidden hover:shadow-lg hover:-translate-y-0.5 transition cursor-pointer" style={{borderColor:"#e2e8f0"}} onClick={onOpen}>
      <div className="p-4">
        <div className="flex items-center justify-between gap-2 mb-2">

          <span className="inline-flex items-center gap-1.5"><IcUser size={12}/>{site.inspector}</span>
        </div>
        <div className="mt-2 flex flex-wrap gap-1.5 text-xs">
          <span className="px-2 py-1 rounded-full bg-slate-900 text-white font-bold flex items-center gap-1"><IcCamera size={11}/>{site.totalCameras} Cam</span>

        <div className="mt-4 flex gap-2">
          <button onClick={e=>{e.stopPropagation(); onEdit();}} className="flex-1 py-2 rounded-full border bg-white text-sm font-semibold inline-flex items-center justify-center gap-1.5 hover:bg-slate-50" style={{borderColor:"#e2e8f0"}}><IcEdit size={14}/> Edit</button>
          <button onClick={e=>{e.stopPropagation(); onDelete();}} className="px-3 py-2 rounded-full border bg-white hover:bg-red-50 hover:text-red-600 hover:border-red-200" style={{borderColor:"#e2e8f0"}}><IcTrash size={16}/></button>
          <button onClick={e=>{e.stopPropagation(); onReport();}} className="px-3 py-2 rounded-full bg-red-600 text-white hover:bg-red-700" title="Report incident"><IcFileText size={16}/></button>
          <a href={ownerUrl(site)} target="_blank" rel="noreferrer" onClick={e=>e.stopPropagation()} className="px-3 py-2 rounded-full bg-sky-600 text-white hover:bg-sky-700 grid place-items-center" title="Open Owner Website"><IcUser size={16}/></a>
        </div>
        <div className="mt-2 text-[11px] text-center text-slate-400">Click card to see issues &amp; charts →</div>
      </div>
    </div>
  );
}

    </Modal>
  );
}

/* ------------- site add/edit modal ------------- */
function SiteFormModal({site, sites, setSites, onClose}){
  const isNew = !site.id;
  const [form, setForm] = useState(()=> isNew ? {
    name:"", location:"", type:"Construction", status:"Pending", date:new Date().toISOString().slice(0,10),
    inspector:"", notes:"", totalCameras:8, offlineCameras:0, totalANPR:2, offlineANPR:0,
    notWorkingANPR:0, notWorkingGate:0, notWorkingIntercom:0,
    pincode:String(1000+Math.floor(Math.random()*9000)).padStart(4,"0"),
  } : {...site});
  const set = (k, v) => setForm(f=>({...f, [k]: v}));
  const save = () => {
    if(!form.name.trim() || !form.location.trim()){ toast.error("Site name and location are required"); return; }
    if(isNew){
      const maxNum = Math.max(0, ...sites.map(s=>{ const m=/^Site (\d+)/.exec(s.name); return m? +m[1] : 0; }));
      const id = siteCode(maxNum+1);
      setSites(list=>[{ ...form, id }, ...list]);
      toast.success("Site added");
    } else {
      setSites(list=>list.map(s=>s.id===site.id ? { ...s, ...form } : s));
      toast.success("Site updated — auto-synced");
    }
    onClose();
  };
  const del = () => {
    if(!window.confirm(`Delete ${site.name}? This cannot be undone.`)) return;
    setSites(list=>list.filter(s=>s.id!==site.id));
    toast.success("Site deleted"); onClose();
  };
  const num = (k, label) => (
    <Field label={label}><input type="number" min="0" value={form[k]} onChange={e=>set(k, +e.target.value)} className={inputCls}/></Field>
  );
  return (
    <Modal title={isNew ? "Add New Site" : "Edit Site"} onClose={onClose} wide>
      <div className="grid sm:grid-cols-2 gap-4">
        <Field label="Site Name *"><input value={form.name} onChange={e=>set("name", e.target.value)} placeholder="e.g. Marina Bay Tower - Level 24" className={inputCls}/></Field>
        <Field label="Location / Address *"><input value={form.location} onChange={e=>set("location", e.target.value)} placeholder="e.g. Dubai Marina, Block B" className={inputCls}/></Field>
        <Field label="Type"><select value={form.type} onChange={e=>set("type", e.target.value)} className={inputCls}>{TYPES.map(t=><option key={t.value} value={t.value}>{t.label}</option>)}</select></Field>
        <Field label="Status"><select value={form.status} onChange={e=>set("status", e.target.value)} className={inputCls}>{STATUS.map(s=><option key={s.value} value={s.value}>{s.label}</option>)}</select></Field>
        <Field label="Inspection Date"><input type="date" value={form.date} onChange={e=>set("date", e.target.value)} className={inputCls}/></Field>
        <Field label="Inspector"><input value={form.inspector} onChange={e=>set("inspector", e.target.value)} placeholder="e.g. Ahmed R." className={inputCls}/></Field>
        <div className="sm:col-span-2"><Field label="Notes"><textarea value={form.notes} onChange={e=>set("notes", e.target.value)} placeholder="Findings, remarks, next action..." rows={2} className={inputCls}/></Field></div>
        {num("totalCameras","Total Cameras")}
        {num("offlineCameras","Offline Cameras")}
        {num("totalANPR","Total ANPR")}
        {num("offlineANPR","Offline ANPR")}
        {num("notWorkingANPR","Not Working ACS")}
        {num("notWorkingGate","Not Working Gate barrier")}
        <Field label="Pincode">
          <div className="flex gap-2">
            <input value={form.pincode} onChange={e=>set("pincode", e.target.value.slice(0,4))} className={`${inputCls} font-mono2 tracking-[0.3em] w-32`}/>
            <button onClick={()=>{ const p2=String(1000+Math.floor(Math.random()*9000)).padStart(4,"0"); set("pincode", p2); toast.success(`New pincode ${p2}`); }}
              className="px-4 rounded-xl bg-slate-100 text-sm font-bold hover:bg-slate-200 flex items-center gap-1.5"><IcRefresh size={14}/> Regenerate</button>
          </div>
        </Field>
        <Field label="Not Working Intercom"><input type="number" min="0" value={form.notWorkingIntercom} onChange={e=>set("notWorkingIntercom", +e.target.value)} className={inputCls}/></Field>
      </div>
      <div className="mt-6 flex gap-2 justify-end">
        {!isNew && <button onClick={del} className="px-4 py-2.5 rounded-full border text-red-600 font-bold text-sm hover:bg-red-50" style={{borderColor:"#fecaca"}}><IcTrash size={14} className="inline mr-1.5 -mt-0.5"/>Delete</button>}
        <button onClick={onClose} className="px-5 py-2.5 rounded-full border font-bold text-sm" style={{borderColor:"#e2e8f0"}}>Cancel</button>
        <button onClick={save} className="px-5 py-2.5 rounded-full bg-slate-900 text-white font-bold text-sm hover:bg-slate-800">{isNew?"Add Site":"Save Changes"}</button>
      </div>
    </Modal>
  );
}

function ChartsPage({sites, incidents, accidents, stats, perSite, attention, problemTotals, setPage}){
  const totalProblems = Object.values(problemTotals).reduce((a,b)=>a+b,0);
  const completion = stats.total ? Math.round((stats.completed/stats.total)*100) : 0;
  const criticalCount = attention.filter(a=>a.severity==="Critical").length;

  const byStatus = STATUS.map((st,i)=>({ name:st.value, value:sites.filter(s=>s.status===st.value).length, color:PALETTE[i%PALETTE.length] })).filter(x=>x.value>0);
  const byType = TYPES.map((t,i)=>({ name:t.value, value:sites.filter(s=>s.type===t.value).length, color:PALETTE[i%PALETTE.length] })).filter(x=>x.value>0);
  const byInspector = Object.entries(sites.reduce((m,s)=>{ m[s.inspector]=(m[s.inspector]||0)+1; return m; },{}))
    .map(([name,value])=>({name, value})).sort((a,b)=>b.value-a.value);
  const probData = PROB_KEYS.map(k=>({ name:k.label, short:k.short, value:problemTotals[k.label]||0, color:k.color }));
  const incidentSites = sites.filter(s=>problemsOf(s, incidents).includes("Incident Sites"));
  probData.push({ name:"Incident Sites", short:"Incidents", value:incidentSites.length, color:"#f59e0b" });
  const topProblem = [...probData].sort((a,b)=>b.value-a.value)[0];

  const worst = [...perSite].sort((a,b)=>
    (b.offlineCameras+b.offlineANPR+b.notWorkingANPR+b.notWorkingGate+b.notWorkingIntercom) -
    (a.offlineCameras+a.offlineANPR+a.notWorkingANPR+a.notWorkingGate+a.notWorkingIntercom)).slice(0,10);

  return (
    <div className="space-y-4">
      <div className="mt-2 flex items-center gap-3">
        <div className="w-9 h-9 rounded-xl bg-[#f2c811] text-slate-900 grid place-items-center"><IcChart size={16}/></div>
        <div>
          <h2 className="text-[18px] font-extrabold leading-none">Charts</h2>
          <p className="text-xs text-slate-500 mt-0.5">Power BI style analytics • Live from your sites</p>
        </div>
        <span className="ml-auto text-xs px-3 py-1 rounded-full bg-white border font-bold text-slate-500" style={{borderColor:"#e2e8f0"}}>{totalProblems} problems tracked</span>
      </div>

      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 lg:gap-4">
        <KPI label="Total Sites" value={stats.total} sub={`${stats.total} sites`} icon={IcBuilding} color="bg-slate-900 text-white"/>
        <button onClick={()=>setPage("attention")} className="text-left">
          <KPI label="Attention Needed" value={attention.length} sub={`${criticalCount} critical • Tap to see sites + problems`} icon={IcAlert} color="bg-red-600 text-white" top="bg-red-500"/>
        </button>
        <KPI label="Total Problems" value={totalProblems} icon={IcAlert} color="bg-amber-500 text-white" top="bg-amber-500"/>
        <KPI label="Completion Rate" value={`${completion}%`} sub={`${stats.completed} of ${stats.total} completed`} icon={IcTrend} color="bg-emerald-500 text-white"/>
      </div>

      <Card title="Problems by Category" subtitle={`${totalProblems} total • Top: ${topProblem? topProblem.name : "—"} (${topProblem? topProblem.value : 0})`} icon={IcAlert}>
        <ResponsiveContainer width="100%" height={260}>
          <BarChart data={probData} layout="vertical" margin={{top:0,right:24,left:10,bottom:0}}>
            <CartesianGrid strokeDasharray="3 3" stroke="#e2e8f0"/>
            <XAxis type="number" allowDecimals={false} tick={{fontSize:11}}/>
            <YAxis type="category" dataKey="name" width={150} tick={{fontSize:11}}/>
            <Tooltip/>
            <Bar dataKey="value" name="Sites" radius={[0,8,8,0]} barSize={16}>
              {probData.map((x,i)=><Cell key={i} fill={x.color}/>)}
            </Bar>
          </BarChart>
        </ResponsiveContainer>
      </Card>

      <div className="grid lg:grid-cols-2 gap-4">
        <Card title="Sites by Status" subtitle="Distribution" icon={IcGrid}>
          <ResponsiveContainer width="100%" height={180}>
            <PieChart>
              <Pie data={byStatus} dataKey="value" nameKey="name" cx="50%" cy="50%" innerRadius={44} outerRadius={68} paddingAngle={2} strokeWidth={2} stroke="#fff">
                {byStatus.map((x,i)=><Cell key={i} fill={x.color}/>)}
              </Pie>
              <Tooltip/>
            </PieChart>
          </ResponsiveContainer>
          <div className="space-y-2 mt-2">
            {STATUS.map((s,i)=>(
              <div key={s.value} className="flex items-center gap-2 text-xs">
                <span className="w-2.5 h-2.5 rounded-sm" style={{background:PALETTE[i%PALETTE.length]}}/>
                <span className="font-semibold">{s.value}</span><span className="ml-auto text-slate-400">{sites.filter(x=>x.status===s.value).length}</span>
              </div>
            ))}
          </div>
        </Card>
        <Card title="Assigned Sites per Person" subtitle="Workload distribution" icon={IcUser}>
          <ResponsiveContainer width="100%" height={260}>
            <BarChart data={byInspector} layout="vertical" margin={{top:0,right:12,left:30,bottom:0}}>
              <CartesianGrid strokeDasharray="3 3" stroke="#e2e8f0"/>
              <XAxis type="number" allowDecimals={false} tick={{fontSize:11}}/>
              <YAxis type="category" dataKey="name" width={90} tick={{fontSize:11}}/>
              <Tooltip/>
              <Bar dataKey="value" name="Sites" radius={[0,8,8,0]} barSize={14}>

            </BarChart>
          </ResponsiveContainer>
        </Card>

      <Card title="Sites by Type" subtitle="Inspection categories" icon={IcGrid}>
        <div className="grid lg:grid-cols-2 gap-4 items-center">
          <ResponsiveContainer width="100%" height={200}>
            <PieChart>
              <Pie data={byType} dataKey="value" nameKey="name" cx="50%" cy="50%" innerRadius={44} outerRadius={68} paddingAngle={2} strokeWidth={2} stroke="#fff">
                {byType.map((x,i)=><Cell key={i} fill={x.color}/>)}

            </PieChart>
          </ResponsiveContainer>
          <div className="space-y-2">
            {byType.map((x,i)=>(
              <div key={x.name} className="flex items-center gap-2 text-sm">
                <span className="w-2.5 h-2.5 rounded-sm" style={{background:x.color}}/>
                <span className="font-semibold">{x.name}</span><span className="ml-auto text-slate-400">{x.value}</span>
              </div>
            ))}
          </div>
        </div>
      </Card>

      <Card title="Security — Device Health" subtitle="Offline CCTV • Offline ANPR • Not Working ACS/Gate/Intercom — worst 10 sites" icon={IcShield}>
        <ResponsiveContainer width="100%" height={280}>
          <BarChart data={worst} margin={{top:8,right:12,left:0,bottom:60}}>
            <CartesianGrid strokeDasharray="3 3" stroke="#e2e8f0"/>
            <XAxis dataKey="shortName" angle={-30} textAnchor="end" height={70} tick={{fontSize:9}} interval={0}/>
            <YAxis tick={{fontSize:11}} allowDecimals={false}/>
            <Tooltip/><Legend wrapperStyle={{fontSize:11}}/>
            <Bar dataKey="offlineCameras" name="Offline CCTV" stackId="a" fill="#0284c7"/>
            <Bar dataKey="offlineANPR" name="Offline ANPR" stackId="a" fill="#ef4444"/>
            <Bar dataKey="notWorkingANPR" name="Not Working ACS" stackId="a" fill="#7c3aed"/>
            <Bar dataKey="notWorkingGate" name="Gate barrier" stackId="a" fill="#0ea5e9"/>
            <Bar dataKey="notWorkingIntercom" name="Intercom" stackId="a" fill="#1e293b"/>
          </BarChart>
        </ResponsiveContainer>
      </Card>
    </div>
  );
}

function ReportsPage({sites, incidents, setIncidents}){
  const [q, setQ] = useState(""); const [fSev, setFSev] = useState("All"); const [fStatus, setFStatus] = useState("All");
  const [editInc, setEditInc] = useState(null); const [quickSite, setQuickSite] = useState("");

  const filtered = useMemo(()=> incidents.filter(i=>{
    const qq=q.trim().toLowerCase();
    const okQ = !qq || (i.title||"").toLowerCase().includes(qq) || (i.siteName||"").toLowerCase().includes(qq) || (i.description||"").toLowerCase().includes(qq);
    const okS = fSev==="All" || i.severity===fSev;
    const okSt = fStatus==="All" || i.status===fStatus;
    return okQ && okS && okSt;
  }), [incidents, q, fSev, fStatus]);

  const counts = {
    total: incidents.length,
    open: incidents.filter(i=>i.status==="Open").length,
    review: incidents.filter(i=>i.status==="In Review").length,
    resolved: incidents.filter(i=>i.status==="Resolved").length,
    critical: incidents.filter(i=>i.severity==="Critical").length,
  };

  const changeStatus = (inc, st) => {
    setIncidents(list=>list.map(x=> x.id===inc.id ? {...x, status:st, history:[...(x.history||[]), {at:new Date().toISOString().slice(0,16).replace("T"," "), by:"Admin", change:`Status ${x.status} → ${st}`}] } : x));
    toast.success(`Status → ${st}`);
  };
  const del = (inc) => {
    if(!window.confirm(`Delete incident "${inc.title}"?`)) return;
    setIncidents(list=>list.filter(x=>x.id!==inc.id));
    toast.success("Incident deleted");
  };

  const quickSiteObj = sites.find(s=>s.id===quickSite);

  return (
    <div className="space-y-4">
      <div className="grid grid-cols-2 lg:grid-cols-5 gap-3">
        <KPI label="Total Reports" value={counts.total} sub={`${counts.open} open`} icon={IcFileText} color="bg-slate-900 text-white"/>
        <KPI label="Open" value={counts.open} sub="needs action" icon={IcAlert} color="bg-red-600 text-white" top="bg-red-500"/>
        <KPI label="In Review" value={counts.review} sub="under review" icon={IcClock} color="bg-amber-500 text-white"/>
        <KPI label="Resolved" value={counts.resolved} sub="fixed" icon={IcCheck} color="bg-emerald-500 text-white"/>
        <KPI label="Critical" value={counts.critical} sub="high priority" icon={IcAlert} color="bg-red-800 text-white"/>
      </div>

      <div className="bg-white rounded-2xl border p-3 flex flex-wrap items-center gap-2" style={{borderColor:"#e2e8f0"}}>
        <div className="relative flex-1 min-w-[220px]">
          <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><IcSearch size={15}/></span>
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search reports by title, site, description..."
            className="w-full pl-9 pr-3 py-2.5 rounded-full border bg-slate-50 focus:bg-white outline-none focus:border-slate-400 text-sm" style={{borderColor:"#e2e8f0"}}/>
        </div>
        <select value={fStatus} onChange={e=>setFStatus(e.target.value)} className="px-4 py-2.5 rounded-full border bg-slate-50 text-sm font-medium outline-none" style={{borderColor:"#e2e8f0"}}>
          <option value="All">All Status</option>
          {INC_STATUS.map(s=><option key={s.value} value={s.value}>{s.label}</option>)}
        </select>
        <select value={fSev} onChange={e=>setFSev(e.target.value)} className="px-4 py-2.5 rounded-full border bg-slate-50 text-sm font-medium outline-none" style={{borderColor:"#e2e8f0"}}>
          <option value="All">All Severity</option>
          {SEVERITIES.map(s=><option key={s} value={s}>{s}</option>)}
        </select>
        <select value={quickSite} onChange={e=>setQuickSite(e.target.value)} className="px-4 py-2.5 rounded-full border bg-slate-50 text-sm font-medium outline-none max-w-[260px]" style={{borderColor:"#e2e8f0"}}>
          <option value="">Quick: Report for site...</option>
          {sites.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
        </select>
      </div>

      {quickSiteObj && <IncidentFormModal sites={sites} incidents={incidents} setIncidents={setIncidents} preSite={quickSiteObj} forceOpen onClose={()=>setQuickSite("")}/>}

      {filtered.length===0 ? (
        <div className="bg-white rounded-2xl border py-14 text-center" style={{borderColor:"#e2e8f0"}}>
          <div className="w-12 h-12 rounded-xl bg-slate-100 text-slate-400 grid place-items-center mx-auto"><IcFileText size={20}/></div>
          <h3 className="mt-3 font-bold">No incident reports</h3>
          <p className="text-sm text-slate-500 mt-1">Nothing matches your filters.</p>
        </div>
      ) : (
        <div className="grid gap-4 lg:grid-cols-2">
          {filtered.map(inc=>(
            <div key={inc.id} className="bg-white rounded-2xl border p-4 relative overflow-hidden" style={{borderColor:"#e2e8f0"}}>
              <div className={`absolute top-0 left-0 w-full h-1 ${inc.severity==="Critical"?"bg-red-700":inc.severity==="High"?"bg-red-500":inc.severity==="Medium"?"bg-amber-500":"bg-slate-900"}`}/>
              <div className="flex items-start gap-3">
                <div className="w-9 h-9 rounded-xl bg-slate-900 text-white grid place-items-center shrink-0"><IcFileText size={15}/></div>
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2 flex-wrap">
                    <h3 className="font-bold text-sm">{inc.title}</h3>
                    <Badge status={inc.status}/>
                  </div>
                  <div className="text-[11px] text-slate-400 mt-0.5 flex items-center gap-2 flex-wrap">
                    <span className="flex items-center gap-1"><IcPin size={11}/>{inc.siteName || "—"}</span>
                    <span className="flex items-center gap-1"><IcUser size={11}/>{inc.reportedBy}</span>
                    <span>{inc.date}</span>
                    <span className="flex items-center gap-1"><IcFileText size={11}/>{inc.category}</span>
                  </div>
                  <p className="text-xs text-slate-600 mt-2">{inc.description}</p>
                  <div className="mt-2 flex items-center gap-2 flex-wrap">
                    <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${severityCls(inc.severity)}`}>{inc.severity}</span>
                    <span className="text-[10px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-600">{inc.history?.length||0} changes</span>
                  </div>
                  {inc.history && inc.history.length>0 && (
                    <div className="mt-3 border-t pt-2" style={{borderColor:"#f1f5f9"}}>
                      <div className="text-[10px] font-bold tracking-widest uppercase text-slate-400 mb-1">Change History</div>
                      {inc.history.slice(-2).map((h,i)=>(
                        <div key={i} className="text-[11px] text-slate-500 flex gap-2"><span className="font-mono2 shrink-0">{h.at}</span><span className="truncate">{h.by} — {h.change}</span></div>
                      ))}
                      {inc.history.length>2 && <div className="text-[10px] text-slate-400">+{inc.history.length-2} earlier</div>}
                    </div>
                  )}
                  <div className="mt-3 flex gap-1.5 flex-wrap">
                    {INC_STATUS.filter(s=>s.value!==inc.status).map(s=>(
                      <button key={s.value} onClick={()=>changeStatus(inc, s.value)} className="text-[11px] font-bold px-2.5 py-1.5 rounded-full border hover:bg-slate-50" style={{borderColor:"#e2e8f0"}}>→ {s.value}</button>
                    ))}
                    <button onClick={()=>setEditInc(inc)} className="text-[11px] font-bold px-2.5 py-1.5 rounded-full bg-slate-900 text-white flex items-center gap-1"><IcEdit size={11}/> Edit</button>
                    <button onClick={()=>del(inc)} className="text-[11px] font-bold px-2.5 py-1.5 rounded-full border text-red-600 hover:bg-red-50" style={{borderColor:"#fecaca"}}><IcTrash size={11}/></button>
                  </div>
                </div>
              </div>
            </div>
          ))}
        </div>
      )}

      {editInc && <IncidentFormModal sites={sites} incidents={incidents} setIncidents={setIncidents} existing={editInc} onClose={()=>setEditInc(null)}/>}
    </div>
  );
}

function IncidentFormModal({sites, incidents, setIncidents, existing, preSite, forceOpen, onClose}){
  const isEdit = !!existing;
  const [form, setForm] = useState(()=> isEdit ? {...existing} : {
    siteId: preSite?.id || "", siteName: preSite?.name || "", title:"", description:"",
    category:"Safety", severity:"Medium", status:"Open", reportedBy: preSite?.inspector || "", date:new Date().toISOString().slice(0,10), history:[],
  });
  const set = (k,v)=>setForm(f=>({...f,[k]:v}));
  const save = () => {
    if(!form.siteId || !form.title.trim()){ toast.error("Site and title required"); return; }
    const site = sites.find(s=>s.id===form.siteId);
    if(isEdit){
      setIncidents(list=>list.map(x=> x.id===existing.id ? {...x, ...form, history:[...(existing.history||[]), {at:new Date().toISOString().slice(0,16).replace("T"," "), by:"Admin", change:"Details updated"}]} : x));
      toast.success("Incident updated — change logged");
    } else {
      setIncidents(list=>[{ ...form, id:uid(), siteName:site?.name||form.siteName, history:[{at:new Date().toISOString().slice(0,16).replace("T"," "), by:form.reportedBy||"Admin", change:`Reported — ${form.severity} severity, ${form.status}`}] }, ...list]);
      toast.success("Incident reported");
    }
    onClose();
  };
  return (
    <Modal title={isEdit ? "Edit Report" : "New Incident Report"} onClose={onClose} wide>
      <div className="grid sm:grid-cols-2 gap-4">
        <Field label="Site *">
          <select value={form.siteId} onChange={e=>set("siteId", e.target.value)} className={inputCls}>
            <option value="">— select site —</option>
            {sites.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
          </select>
        </Field>
        <Field label="Date Reported"><input type="date" value={form.date} onChange={e=>set("date", e.target.value)} className={inputCls}/></Field>
        <div className="sm:col-span-2"><Field label="Title *">
          <input value={form.title} onChange={e=>set("title", e.target.value)} placeholder="e.g. Scaffold tie missing - North face" className={inputCls}/>
        </Field></div>
        <Field label="Category"><select value={form.category} onChange={e=>set("category", e.target.value)} className={inputCls}>{CATEGORIES.map(c=><option key={c} value={c}>{c}</option>)}</select></Field>
        <Field label="Severity"><select value={form.severity} onChange={e=>set("severity", e.target.value)} className={inputCls}>{SEVERITIES.map(s=><option key={s} value={s}>{s}</option>)}</select></Field>
        <Field label="Status"><select value={form.status} onChange={e=>set("status", e.target.value)} className={inputCls}>{INC_STATUS.map(s=><option key={s.value} value={s.value}>{s.label}</option>)}</select></Field>
        <Field label="Reported By"><input value={form.reportedBy} onChange={e=>set("reportedBy", e.target.value)} placeholder="e.g. Ahmed R." className={inputCls}/></Field>
        <div className="sm:col-span-2"><Field label="Description">
          <textarea value={form.description} onChange={e=>set("description", e.target.value)} placeholder="What was found? Include details for re-inspection..." rows={3} className={inputCls}/>
        </Field></div>
      </div>
      <p className="text-[11px] text-slate-500 mt-3">Changing status is logged in history</p>
      <div className="mt-4 flex gap-2 justify-end">
        <button onClick={onClose} className="px-5 py-2.5 rounded-full border font-bold text-sm" style={{borderColor:"#e2e8f0"}}>Cancel</button>
        <button onClick={save} className="px-5 py-2.5 rounded-full bg-slate-900 text-white font-bold text-sm hover:bg-slate-800">{isEdit?"Save Changes":"Report"}</button>
      </div>
    </Modal>
  );
}

/* ------------- accident report modal ------------- */
function AccidentFormModal({sites, accidents, setAccidents, existing, preSite, onClose}){

        <Field label="Status"><select value={form.status} onChange={e=>set("status", e.target.value)} className={inputCls}>{INC_STATUS.map(s=><option key={s.value} value={s.value}>{s.label}</option>)}</select></Field>

        <div className="sm:col-span-2"><Field label="Description">

        </Field></div>
      </div>
      <p className="text-[11px] text-slate-500 mt-3">Reported accidents appear on this site and on the head-office dashboard</p>
      <div className="mt-4 flex gap-2 justify-end">
        <button onClick={onClose} className="px-5 py-2.5 rounded-full border font-bold text-sm" style={{borderColor:"#e2e8f0"}}>Cancel</button>
        <button onClick={save} className="px-5 py-2.5 rounded-full bg-slate-900 text-white font-bold text-sm hover:bg-slate-800">{isEdit?"Save Changes":"Report Accident"}</button>
      </div>
    </Modal>
  );
}

        </div>
      </div>

      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 lg:gap-4">
        {stats.map((s,i)=>(
          <div key={s.label} className="bg-white rounded-2xl border p-4" style={{borderColor:"#e2e8f0"}}>
            <div className="text-3xl font-extrabold">{s.value}</div>
            <div className="text-xs font-medium text-slate-500 mt-1 uppercase tracking-widest">{s.label}</div>
          </div>
        ))}
      </div>

      <Card title="Key Insights" subtitle="AI-detected anomalies and recommendations" icon={IcSparkles}>
        <div className="space-y-3">
          {insights.map((it,i)=>(
            <div key={i} className="flex items-start gap-3 border rounded-xl p-3" style={{borderColor:"#eef2f7"}}>
              <span className={`shrink-0 text-[10px] font-bold tracking-widest px-2 py-1 rounded-full border ${it.cls}`}>{it.level}</span>
              <p className="text-sm text-slate-600">{it.text}</p>
            </div>
          ))}
        </div>
      </Card>

      <Card title="Executive Summary" subtitle="Generated by DHRE AI Security Analyst" icon={IcFileText}>
        <p className="text-sm text-slate-600 leading-relaxed">
          Today's security posture shows elevated threat activity during early morning hours. A coordinated brute-force attempt was blocked by rate-limiting rules, though one credential compromise was confirmed. The critical CVE on node-03 requires immediate attention. Overall system resilience remains strong with 99.2% uptime.
        </p>
        <p className="text-[11px] text-slate-400 mt-3">DHRE AI Security Analyst · Generated {synced}</p>
      </Card>
    </div>
  );
}

/* ================================================================ */
/*                        OWNER DASHBOARD                           */
/* ================================================================ */
function OwnerView({auth, sites, setSites, incidents, setIncidents, accidents, setAccidents, onLogout, setRemoteOn, syncMode, lastSync}){
  const site = sites.find(s=>s.id===auth.siteId);
  const [editOpen, setEditOpen] = useState(false); const [newIncOpen, setNewIncOpen] = useState(false); const [newAccOpen, setNewAccOpen] = useState(false);
  if(!site) return (
    <div className="min-h-screen grid place-items-center p-6">
      <div className="bg-white rounded-2xl border p-8 text-center max-w-[420px]" style={{borderColor:"#e2e8f0"}}>
        <h2 className="font-extrabold text-lg">Site not found</h2>
        <p className="text-sm text-slate-500 mt-1">This site may have been removed from the main dashboard.</p>
        <button onClick={onLogout} className="mt-4 px-4 py-2 rounded-full bg-slate-900 text-white text-sm font-bold">Back to login</button>
      </div>
    </div>
  );

  const siteIncidents = incidents.filter(i=> i.siteId===site.id || i.siteName===site.name);
  const siteAccidents = accidents.filter(a=> a.siteId===site.id);
  const problems = problemsOf(site, incidents);
  const probBars = PROB_KEYS.map(k=>({ name:k.short, value:site[k.key]||0, color:k.color }));

  const HeaderRight = (
    <>
      <span className="hidden lg:inline text-xs text-sky-200 max-w-[160px] truncate">{site.name} • {site.inspector} • {site.pincode}</span>
      <button onClick={onLogout} className="px-3 py-1.5 rounded-full bg-white/15 text-white border border-white/20 text-xs font-bold hover:bg-white/20 flex items-center gap-1.5">
        <IcLogout size={13}/> Logout
      </button>
    </>
  );

  return (
    <div className="min-h-screen bg-[#f8fafc] text-slate-900">
      <Header title="My Site Website" syncMode={syncMode} onToggleLive={()=>setRemoteOn(v=>!v)} lastSync={lastSync} right={HeaderRight}>
        <div className="border-t bg-sky-50" style={{borderColor:"#e0f2fe"}}>
          <div className="max-w-[1280px] mx-auto px-4 lg:px-6 h-[44px] flex items-center justify-center">
            <div className="text-xs font-bold tracking-widest uppercase text-sky-700 flex items-center gap-2 w-full">
              <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"/>
              <span className="truncate">My Site Website — {site.name} • One dashboard • All things for this site</span>
              <button onClick={()=>setEditOpen(true)} className="ml-auto px-3 py-1 rounded-full bg-slate-900 text-white text-[11px] font-bold shrink-0">Edit</button>
            </div>
          </div>
        </div>
      </Header>

      <main className="max-w-[1280px] mx-auto px-4 lg:px-6 py-6 lg:py-8 space-y-4">
        {/* site info card */}
        <div className="bg-white rounded-2xl border p-4 flex items-center justify-between gap-3" style={{borderColor:"#e2e8f0"}}>
          <div className="flex items-center gap-3 min-w-0">
            <div className="w-10 h-10 rounded-xl grid place-items-center text-white bg-blue-500"><IcHome size={18}/></div>
            <div className="min-w-0">
              <div className="font-extrabold leading-none truncate">{site.name}</div>
              <div className="text-xs text-slate-500 flex items-center gap-1.5 flex-wrap mt-0.5">
                <IcPin size={11}/>{site.location} • {site.type} • <StatusBadge status={site.status}/> • <span className="font-mono2 font-bold">{site.pincode}</span>
              </div>
            </div>
          </div>
          <span className="hidden sm:inline-flex text-xs px-2 py-1 rounded-full bg-sky-50 border border-sky-200 font-bold text-sky-700">My Site Website — All things in one dashboard</span>
        </div>

        {/* KPIs */}
        <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
          <div className="bg-white rounded-xl border p-3" style={{borderColor:"#e2e8f0"}}>
            <div className="text-[11px] font-bold tracking-widest uppercase text-slate-500">Total Cameras</div>
            <div className="text-2xl font-extrabold">{site.totalCameras}</div>
            <div className="text-xs text-slate-500">{site.totalCameras-(site.offlineCameras||0)} online • {site.offlineCameras||0} offline</div>
          </div>
          <div className="bg-white rounded-xl border p-3" style={{borderColor:"#e2e8f0"}}>
            <div className="text-[11px] font-bold tracking-widest uppercase text-red-600">Offline CCTV</div>
            <div className="text-2xl font-extrabold text-red-600">{site.offlineCameras||0}</div>
          </div>
          <div className="bg-white rounded-xl border p-3" style={{borderColor:"#e2e8f0"}}>
            <div className="text-[11px] font-bold tracking-widest uppercase text-slate-500">Total ANPR</div>
            <div className="text-2xl font-extrabold">{site.totalANPR}</div>
          </div>
          <div className="bg-white rounded-xl border p-3" style={{borderColor:"#e2e8f0"}}>
            <div className="text-[11px] font-bold tracking-widest uppercase text-amber-700">Offline ANPR</div>
            <div className="text-2xl font-extrabold text-amber-600">{site.offlineANPR||0}</div>
          </div>
        </div>

        {/* not working + problems */}
        <div className="grid lg:grid-cols-3 gap-3">
          <div className="bg-white rounded-xl border p-3" style={{borderColor:"#e2e8f0"}}>
            <div className="text-xs font-bold tracking-widest uppercase text-slate-500">Not Working</div>
            <div className="mt-2 space-y-1 text-xs">
              <div className="flex justify-between"><span>ACS</span><b>{site.notWorkingANPR||0}</b></div>
              <div className="flex justify-between"><span>Gate barrier</span><b>{site.notWorkingGate||0}</b></div>
              <div className="flex justify-between"><span>Intercom</span><b>{site.notWorkingIntercom||0}</b></div>
            </div>
          </div>
          <div className="bg-white rounded-xl border p-3 lg:col-span-2" style={{borderColor:"#e2e8f0"}}>
            <div className="text-xs font-bold tracking-widest uppercase text-slate-500">Problems for this site</div>
            <div className="mt-2 flex flex-wrap gap-1.5">
              {problems.length===0 ? <span className="px-2 py-1 rounded-full bg-emerald-50 border border-emerald-200 text-xs font-bold text-emerald-700">All systems online</span> :
                problems.map(p=> <span key={p} className="px-2 py-1 rounded-full bg-amber-50 border border-amber-200 text-xs font-bold text-amber-800">{p}</span>)}
            </div>
            <div className="mt-2 h-[100px]">
              <ResponsiveContainer width="100%" height={100}>
                <BarChart data={probBars} margin={{top:5,right:5,left:-20,bottom:0}}>
                  <CartesianGrid strokeDasharray="3 3" stroke="#f1f5f9"/>
                  <XAxis dataKey="name" tick={{fontSize:10, fill:"#64748b"}}/>
                  <YAxis tick={{fontSize:10, fill:"#64748b"}} allowDecimals={false}/>
                  <Tooltip/>
                  <Bar dataKey="value" name="Count" radius={[3,3,0,0]}>
                    {probBars.map((x,i)=><Cell key={i} fill={x.color}/>)}
                  </Bar>
                </BarChart>
              </ResponsiveContainer>
            </div>
          </div>
        </div>

        {/* incidents + accidents */}
        <div className="grid lg:grid-cols-2 gap-3">
          <div className="bg-white rounded-xl border overflow-hidden" style={{borderColor:"#e2e8f0"}}>
            <div className="px-3 py-2 border-b bg-slate-50 font-bold text-sm flex items-center justify-between" style={{borderColor:"#eef2f7"}}>
              <span className="flex items-center gap-1.5"><IcFileText size={14}/> Incidents — {siteIncidents.length}</span>
              <div className="flex items-center gap-2"><span className="text-xs underline text-slate-500">View all →</span><button onClick={()=>setNewIncOpen(true)} className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-red-600 text-white text-[11px] font-bold hover:bg-red-700 shadow-sm"><IcPlus size={12}/> Add</button></div>
            </div>
            <div className="p-3 space-y-2 max-h-[320px] overflow-auto">
              {siteIncidents.length===0 ? <div className="text-xs text-slate-500 text-center py-6">No incidents for this site.</div> : siteIncidents.map(i=>(
                <div key={i.id} className="border rounded-xl p-2.5 bg-slate-50" style={{borderColor:"#eef2f7"}}>
                  <div className="text-xs font-bold">{i.title}</div>
                  <div className="text-xs text-slate-600 line-clamp-2">{i.description}</div>
                  <div className="mt-1 flex gap-1">
                    <span className={`px-1.5 py-0.5 rounded-full border text-[11px] font-bold ${severityCls(i.severity)}`}>{i.severity}</span>
                    <span className="ml-auto text-[11px] text-slate-500">{i.status} • {i.date}</span>
                  </div>
                </div>
              ))}
            </div>
          </div>
          <div className="bg-white rounded-xl border overflow-hidden" style={{borderColor:"#e2e8f0"}}>
            <div className="px-3 py-2 border-b bg-red-50 font-bold text-sm flex items-center justify-between" style={{borderColor:"#fecaca"}}>
              <span className="flex items-center gap-1.5"><IcAlert size={14}/> Accidents — {siteAccidents.length}</span>
              <div className="flex items-center gap-2">
                <span className="text-xs px-2 py-1 rounded-full bg-white border" style={{borderColor:"#fecaca"}}>{siteAccidents.filter(a=>a.status!=="Closed").length} open</span>
                <button onClick={()=>setNewAccOpen(true)} className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-red-600 text-white text-[11px] font-bold hover:bg-red-700 shadow-sm"><IcPlus size={12}/> Add</button>
              </div>
            </div>
            <div className="p-3 space-y-2 max-h-[320px] overflow-auto">
              {siteAccidents.length===0 ? <div className="text-xs text-slate-500 text-center py-6">No accidents for this site.</div> : siteAccidents.map(a=>(
                <div key={a.id} className="border rounded-xl p-2.5 bg-slate-50" style={{borderColor:"#eef2f7"}}>
                  <div className="text-xs font-bold">{a.title||a.type||"Accident"}</div>
                  <div className="text-xs text-slate-600 line-clamp-2">{a.description||""}</div>
                  <div className="mt-1 flex gap-1 flex-wrap items-center">
                    {a.type && <span className="px-1.5 py-0.5 rounded-full border bg-white text-[11px] font-bold text-slate-600" style={{borderColor:"#e2e8f0"}}>{a.type}</span>}
                    <span className={`px-1.5 py-0.5 rounded-full border text-[11px] font-bold ${severityCls(a.severity)}`}>{a.severity}</span>
                    <span className="ml-auto text-[11px] text-slate-500">{a.status} • {a.date}</span>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      </main>

      {editOpen && <SiteFormModal site={site} sites={sites} setSites={setSites} onClose={()=>setEditOpen(false)}/>}
      {newIncOpen && <IncidentFormModal sites={[site]} incidents={incidents} setIncidents={setIncidents} preSite={site} onClose={()=>setNewIncOpen(false)}/>}
      {newAccOpen && <AccidentFormModal sites={[site]} accidents={accidents} setAccidents={setAccidents} preSite={site} onClose={()=>setNewAccOpen(false)}/>}
      <Toaster/>
    </div>
  );
}

/* ---------------- boot ---------------- */
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
    </script>
  </body>
